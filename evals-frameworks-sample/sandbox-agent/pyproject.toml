[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-agent"
version = "0.1.0"
description = "Tool-calling agents that execute every instruction inside an Azure Container Apps sandbox."
requires-python = ">=3.10"
dependencies = [
    "azure-containerapps-sandbox>=0.1.0b4",
    "azure-identity>=1.17",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sandbox-agent = "sandbox_agent.cli:main"
sandbox-agent-ui = "sandbox_agent.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sandbox_agent = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
